# SnappyMail on nginx (mounted as /etc/nginx/conf.d/default.conf).
# SnappyMail ships its protections as Apache .htaccess files; the deny rules
# below do the same job for nginx.

server {
    listen 80;
    root /var/www/html;
    index index.php;
    charset utf-8;
    server_tokens off;

    # largest attachment that can be uploaded (keep in step with php.ini)
    client_max_body_size 25M;

    # Behind a reverse proxy (Caddy, Traefik) on a private or Tailscale
    # network, use the real client address from X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Not for the web: SnappyMail's PHP code, a data folder in the web root,
    # and hidden files such as .htaccess. These must come before the PHP rule.
    location ~ ^/snappymail/v/[^/]+/app/ { deny all; }
    location ^~ /data { deny all; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:gif|jpe?g|png|ico|otf|eot|svg|ttf|woff2?)$ {
        expires 30d;
        log_not_found off;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_request_buffering off;
    }
}
