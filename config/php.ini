; PHP settings for SnappyMail (mounted into the php container)
expose_php = Off
display_errors = Off
log_errors = On

; largest attachment that can be uploaded (keep in step with nginx.conf)
upload_max_filesize = 25M
post_max_size = 25M
memory_limit = 128M

; from the TZ variable in docker-compose.yml
date.timezone = ${TZ}

session.cookie_httponly = On
session.use_only_cookies = On
