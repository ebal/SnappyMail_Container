; PHP settings for SnappyMail (copied into the image)
expose_php = Off
display_errors = Off
log_errors = On

; largest attachment that can be uploaded
upload_max_filesize = 25M
post_max_size = 25M
memory_limit = 128M

; from the TZ variable (image default UTC)
date.timezone = ${TZ}

session.cookie_httponly = On
session.use_only_cookies = On
