# Copy README.md to the Docker Hub page of the image, and set its short
# description. Runs when README.md changes, and on demand.
#
# Uses the same settings as publish.yml. Docker Hub needs a token with
# Read, Write, Delete access to change a description; a Read & Write token
# fails only this job, never the image build.

name: dockerhub-description

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/dockerhub-description.yml"

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'snappymail-php' }}
          short-description: "PHP-FPM 8.5 (Alpine) with every extension SnappyMail uses, rebuilt weekly"
          # relative links in README.md (LICENSE, ...) point to GitHub
          enable-url-completion: true
