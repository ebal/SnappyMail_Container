# Build the php image every week and publish it to Docker Hub only when it
# changed, so PHP and Alpine security updates arrive within a week.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME   Docker Hub user or organisation
#   variable DOCKERHUB_REPOSITORY image name, default "snappymail-php"
#   secret   DOCKERHUB_TOKEN      Docker Hub access token (Read & Write)
#
# Tags: 8.5 (moves), 8.5-YYYYMMDD (fixed), latest (moves).

name: publish

on:
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "php/**"
      - "ci/fingerprint.sh"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  actions: write   # keep the weekly schedule enabled (last step)

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'snappymail-php' }}
  TAG: "8.5"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build without cache, from the newest base image
        run: docker build --pull --no-cache -t snappymail-php:candidate php

      - name: Compare with the published image
        id: compare
        run: |
          new=$(ci/fingerprint.sh snappymail-php:candidate)
          if docker pull -q "$IMAGE:$TAG" >/dev/null 2>&1; then
            old=$(ci/fingerprint.sh "$IMAGE:$TAG")
          else
            old=none
          fi
          php=$(docker run --rm --entrypoint php snappymail-php:candidate -r 'echo PHP_VERSION;')
          echo "php $php, fingerprint new=$new published=$old"
          # A scheduled run publishes only a changed image; a push or a manual
          # run always publishes.
          if [ "$new" != "$old" ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.compare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: steps.compare.outputs.publish == 'true'
        run: |
          for tag in "$TAG" "$TAG-$(date -u +%Y%m%d)" latest; do
            docker tag snappymail-php:candidate "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done

      # GitHub disables a scheduled workflow after 60 days without activity
      # in the repository. Enabling it again from the workflow keeps it alive.
      - name: Keep the weekly schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
