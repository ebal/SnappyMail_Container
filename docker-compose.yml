# SnappyMail webmail: http://<host>:8080/   (admin panel: /?admin)
#
#   snappymail  the image of this repository (Apache + PHP + SnappyMail)
#   valkey      official image, cache for the "Cache Redis" plugin (no disk data)
#
# Before the first start, the data folder must belong to uid 82:
#   mkdir -p data && sudo chown 82:82 data
# Start: docker compose up -d
# Settings that differ per host go in .env (see README): HTTP_PORT, TZ,
# SNAPPYMAIL_IMAGE, VALKEY_IMAGE_TAG.

name: snappymail

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# No root, no Linux capabilities, read-only file system.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  snappymail:
    <<: *hardening
    # Pulled from Docker Hub; "docker compose build" builds it from this folder.
    image: ${SNAPPYMAIL_IMAGE:-3bal/snappymail:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/var/lib/snappymail
    tmpfs:
      - /tmp
      - /run/apache2
      - /run/lock
    depends_on:
      valkey:
        condition: service_healthy
    logging: *logging

  valkey:
    <<: *hardening
    image: valkey/valkey:${VALKEY_IMAGE_TAG:-9-alpine}
    # the image's own user: the entrypoint needs no root to drop privileges
    user: "999:1000"
    restart: unless-stopped
    # Cache only: no snapshots, no append-only file, oldest keys go first.
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging
