# SnappyMail webmail: http://<host>:8080/   (admin panel: /?admin)
#
#   fetch   one-shot: downloads SNAPPYMAIL_VERSION into ./snappymail
#   php     PHP-FPM with every extension SnappyMail uses (php/Dockerfile)
#   nginx   official image, serves the files and passes PHP to "php"
#
# Start: docker compose up -d
# Settings that differ per host go in .env (see README): HTTP_PORT, TZ,
# SNAPPYMAIL_PHP_IMAGE.

name: snappymail

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  fetch:
    image: alpine:3.24
    restart: "no"
    command: ["/bin/sh", "/scripts/fetch-snappymail.sh"]
    environment:
      SNAPPYMAIL_VERSION: "3.1.3"
      # sha256 of snappymail-<version>.tar.gz, from the GitHub release page
      SNAPPYMAIL_SHA256: "723ce03531ee4f6247f1912b8ce3ba22009e9f3f95207b98c2fc4c921f8ff476"
    volumes:
      - ./snappymail:/app
      - ./data:/data
      - ./scripts:/scripts:ro
    # One-shot: it exits after the download. The check is its real result:
    # the SnappyMail files and include.php are in place.
    healthcheck:
      test: ["CMD", "test", "-f", "/app/include.php"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging

  php:
    # Built locally from php/, or pulled from a registry when
    # SNAPPYMAIL_PHP_IMAGE names a published image.
    build: ./php
    image: ${SNAPPYMAIL_PHP_IMAGE:-snappymail-php:8.5}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./snappymail:/var/www/html:ro
      - ./data:/var/lib/snappymail
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-snappymail.ini:ro
    depends_on:
      fetch:
        condition: service_completed_successfully
    healthcheck:
      # php-fpm accepts connections on its FastCGI port
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./snappymail:/var/www/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      # the login page renders: nginx, PHP and SnappyMail all work
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging
